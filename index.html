<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AeroTwin AI — Drone-to-3D Digital Twin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e13;
    --bg-alt:#0d1218;
    --surface:#121820;
    --surface-2:#182029;
    --surface-3:#1e2833;
    --line:#26313d;
    --line-soft:#1b232c;
    --text:#dfe6ec;
    --text-dim:#8a97a3;
    --text-faint:#5c6976;
    --accent:#5fc4ae;
    --accent-dim:#3a7d70;
    --accent-glow:rgba(95,196,174,0.35);
    --amber:#d99a4e;
    --amber-dim:#8a6836;
    --red:#d9695a;
    --blue:#5b8fc9;
    --violet:#9b8fd6;
    --radius:10px;
    --radius-sm:6px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--line);}

  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- App shell ---------- */
  #app{display:flex;height:100vh;width:100vw;}

  /* Sidebar */
  #sidebar{
    width:246px;flex:none;
    background:linear-gradient(180deg,#0c1117,#0a0e13);
    border-right:1px solid var(--line-soft);
    display:flex;flex-direction:column;
    padding:20px 14px;
    overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:2px 6px 22px 6px;}
  .brand-mark{
    width:32px;height:32px;border-radius:8px;flex:none;
    background:radial-gradient(circle at 30% 30%, var(--accent), var(--accent-dim));
    position:relative;box-shadow:0 0 18px var(--accent-glow);
  }
  .brand-mark::after{
    content:"";position:absolute;inset:7px;border-radius:4px;
    border:1.5px solid rgba(10,14,19,0.55);
  }
  .brand-name{font-weight:600;font-size:14.5px;letter-spacing:0.5px;line-height:1.1;}
  .brand-sub{font-size:10px;color:var(--text-faint);letter-spacing:1.2px;margin-top:2px;}

  .nav-section{margin-top:14px;}
  .nav-section:first-of-type{margin-top:6px;}
  .nav-section-label{font-size:9.5px;letter-spacing:1.4px;color:var(--text-faint);font-weight:600;padding:0 11px 6px 11px;}
  nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:8.5px 11px;border-radius:var(--radius-sm);
    color:var(--text-dim);font-size:13px;font-weight:500;
    border:1px solid transparent;
    transition:background .15s, color .15s, border-color .15s;
    position:relative;
  }
  .nav-item svg{flex:none;width:15px;height:15px;opacity:.85;}
  .nav-item:hover{background:var(--surface);color:var(--text);}
  .nav-item.active{
    background:linear-gradient(90deg, rgba(95,196,174,0.14), rgba(95,196,174,0.02));
    color:var(--text);border-color:rgba(95,196,174,0.25);
  }
  .nav-item.active::before{
    content:"";position:absolute;left:-14px;top:7px;bottom:7px;width:2.5px;
    background:var(--accent);border-radius:2px;box-shadow:0 0 8px var(--accent-glow);
  }
  .nav-badge{margin-left:auto;font-size:10px;font-weight:700;background:var(--red);color:#1c0a07;border-radius:20px;padding:1px 6px;font-family:'IBM Plex Mono';}

  .sys-status{
    border-top:1px solid var(--line-soft);padding-top:14px;margin-top:14px;
  }
  .sys-status-title{font-size:10px;letter-spacing:1.4px;color:var(--text-faint);margin-bottom:9px;font-weight:600;}
  .sys-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);padding:3px 2px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 6px var(--accent-glow);animation:pulse 2.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

  /* Main */
  #main{flex:1;display:flex;flex-direction:column;min-width:0;}
  #topbar{
    height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 26px;border-bottom:1px solid var(--line-soft);background:rgba(10,14,19,0.7);backdrop-filter:blur(6px);
    position:relative;z-index:20;
  }
  .page-title{font-size:16px;font-weight:600;}
  .page-title-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
  .topbar-right{display:flex;align-items:center;gap:16px;}
  .status-pill{
    display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:0.8px;
    padding:5px 11px;border-radius:20px;background:rgba(95,196,174,0.1);border:1px solid rgba(95,196,174,0.3);color:var(--accent);
  }
  .clock{font-size:12px;color:var(--text-dim);}
  .clock .mono{color:var(--text);}

  .bell-wrap{position:relative;}
  .bell-btn{
    width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);border:1px solid var(--line-soft);background:var(--surface);position:relative;
  }
  .bell-btn:hover{color:var(--text);border-color:var(--accent-dim);}
  .bell-btn svg{width:16px;height:16px;}
  .bell-count{
    position:absolute;top:-4px;right:-4px;background:var(--red);color:#1c0a07;font-size:9.5px;font-weight:700;
    border-radius:20px;padding:1px 5px;font-family:'IBM Plex Mono';border:2px solid var(--bg);
  }
  .bell-dropdown{
    display:none;position:absolute;top:44px;right:0;width:320px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 20px 40px -12px rgba(0,0,0,0.6);overflow:hidden;
  }
  .bell-dropdown.show{display:block;}
  .bell-dropdown-head{padding:12px 14px;border-bottom:1px solid var(--line-soft);font-size:11.5px;font-weight:600;color:var(--text-dim);letter-spacing:0.5px;}
  .bell-item{padding:11px 14px;border-bottom:1px solid var(--line-soft);display:flex;gap:10px;align-items:flex-start;}
  .bell-item:hover{background:var(--surface-3);}
  .bell-sev-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none;}
  .bell-item-title{font-size:12px;font-weight:600;}
  .bell-item-meta{font-size:10.5px;color:var(--text-faint);margin-top:1px;}
  .bell-dropdown-foot{padding:10px 14px;text-align:center;font-size:12px;color:var(--accent);font-weight:600;}
  .bell-dropdown-foot:hover{background:var(--surface-3);}

  #content{flex:1;overflow-y:auto;padding:22px 26px 60px 26px;}
  .page{display:none;animation:fadein .25s ease;}
  .page.active{display:block;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- shared panel/card styling ---------- */
  .panel{
    background:linear-gradient(180deg, var(--surface), var(--surface-2) 130%);
    border:1px solid var(--line-soft);
    border-radius:var(--radius);
    position:relative;
  }
  .panel-glow{box-shadow:0 0 0 1px rgba(95,196,174,0.08), 0 12px 30px -18px rgba(0,0,0,0.6);}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 17px;border-bottom:1px solid var(--line-soft);gap:12px;flex-wrap:wrap;}
  .panel-title{font-size:12px;font-weight:600;letter-spacing:1px;color:var(--text-dim);}
  .panel-body{padding:17px;}

  .grid{display:grid;gap:16px;}
  .kpi-grid{grid-template-columns:repeat(4,1fr);}
  .kpi-card{
    padding:17px 18px;border-radius:var(--radius);
    background:linear-gradient(160deg, var(--surface), var(--surface-2));
    border:1px solid var(--line-soft);
    display:flex;flex-direction:column;gap:6px;
  }
  .kpi-top{display:flex;align-items:center;justify-content:space-between;}
  .kpi-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:rgba(95,196,174,0.1);color:var(--accent);}
  .kpi-icon svg{width:15px;height:15px;}
  .kpi-value{font-size:26px;font-weight:600;font-family:'IBM Plex Mono';letter-spacing:-0.5px;}
  .kpi-label{font-size:11.5px;color:var(--text-faint);letter-spacing:0.3px;}
  .kpi-trend{font-size:11px;font-weight:600;display:flex;align-items:center;gap:3px;}
  .trend-up{color:var(--accent);}
  .trend-down{color:var(--red);}

  .badge{
    font-size:10.5px;font-weight:600;letter-spacing:0.6px;padding:2.5px 8px;border-radius:20px;
    display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  }
  .badge-live{background:rgba(217,105,90,0.12);color:var(--red);border:1px solid rgba(217,105,90,0.35);}
  .badge-live .dot{background:var(--red);box-shadow:0 0 6px rgba(217,105,90,0.5);}
  .badge-ok{background:rgba(95,196,174,0.1);color:var(--accent);border:1px solid rgba(95,196,174,0.3);}
  .badge-amber{background:rgba(217,154,78,0.1);color:var(--amber);border:1px solid rgba(217,154,78,0.3);}
  .badge-blue{background:rgba(91,143,201,0.1);color:var(--blue);border:1px solid rgba(91,143,201,0.3);}
  .badge-violet{background:rgba(155,143,214,0.1);color:var(--violet);border:1px solid rgba(155,143,214,0.3);}
  .badge-red{background:rgba(217,105,90,0.1);color:var(--red);border:1px solid rgba(217,105,90,0.3);}

  .btn{
    font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:var(--radius-sm);
    border:1px solid var(--line);background:var(--surface-3);color:var(--text);
    display:inline-flex;align-items:center;gap:7px;transition:all .15s;
  }
  .btn:hover{border-color:var(--accent-dim);background:#212c37;}
  .btn-primary{background:linear-gradient(160deg, var(--accent), var(--accent-dim));border:none;color:#06120f;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn svg{width:14px;height:14px;}
  .btn-sm{padding:6px 11px;font-size:11.5px;}

  .tag{font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--surface-3);color:var(--text-dim);font-family:'IBM Plex Mono';}

  hr.sep{border:none;border-top:1px solid var(--line-soft);margin:14px 0;}

  input[type=text],input[type=search],select,textarea{
    background:var(--surface-3);border:1px solid var(--line);color:var(--text);
    padding:8px 12px;border-radius:var(--radius-sm);font-size:12.5px;font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-dim);}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{
    text-align:left;font-size:10.5px;letter-spacing:0.8px;color:var(--text-faint);
    padding:9px 12px;border-bottom:1px solid var(--line-soft);font-weight:600;position:sticky;top:0;background:var(--surface);
  }
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line-soft);color:var(--text-dim);}
  tbody tr{cursor:pointer;transition:background .12s;}
  tbody tr:hover{background:var(--surface-2);}
  tbody tr.selected{background:rgba(95,196,174,0.08);}
  tbody td.strong{color:var(--text);font-weight:500;}

  .tooltip{position:relative;}
  .tooltip:hover::after{
    content:attr(data-tip);position:absolute;bottom:130%;left:50%;transform:translateX(-50%);
    background:#000;color:#fff;padding:5px 9px;border-radius:5px;font-size:10.5px;white-space:nowrap;
    z-index:50;border:1px solid var(--line);
  }

  .empty-state{
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;
    color:var(--text-faint);gap:10px;text-align:center;
  }
  .empty-state svg{width:34px;height:34px;opacity:.5;}

  /* ---------- 3D scene viewer ---------- */
  .scene-wrap{
    position:relative;border-radius:var(--radius);overflow:hidden;
    background:radial-gradient(ellipse at 50% 20%, #10222a 0%, #060a0e 70%);
    border:1px solid var(--line-soft);
  }
  .scene-viewport{width:100%;height:100%;perspective:1400px;overflow:hidden;position:relative;cursor:grab; background:radial-gradient(ellipse at 50% 20%, #10222a 0%, #060a0e 70%);}
  .scene-viewport:active{cursor:grabbing;}
  .scene-viewport canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;}
  .scene-world{
    position:absolute;left:50%;top:52%;
    transform-style:preserve-3d;
    transform:translate(-50%,-50%) rotateX(58deg) rotateZ(-28deg) scale(0.62);
    width:1000px;height:700px;
    transition:transform .05s linear;
  }
  .scene-floor{
    position:absolute;left:0;top:0;width:1000px;height:700px;
    background-image:
      linear-gradient(rgba(95,196,174,0.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(95,196,174,0.09) 1px, transparent 1px),
      linear-gradient(140deg,#0c1a1f,#0a1418 60%, #091116);
    background-size:40px 40px, 40px 40px, 100% 100%;
    border:1px solid rgba(95,196,174,0.12);
  }
  .scene-road{position:absolute;background:#222d36;box-shadow:0 0 0 1px #2c3944;}
  .scene-veg{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%, #3f6a52, #1d3527);transform-style:preserve-3d;}
  .bldg{position:absolute;transform-style:preserve-3d;}
  .bldg .face{position:absolute;border:1px solid rgba(0,0,0,0.35);}
  .bldg .face-top{background:linear-gradient(160deg,#3c4a58,#2a3540);}
  .bldg .face-front{background:linear-gradient(180deg,#232e38,#161e26);}
  .bldg .face-side{background:linear-gradient(180deg,#1b242c,#10161c);}

  .marker{
    position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;cursor:pointer;
    font-size:13px;transform-style:preserve-3d;
    box-shadow:0 0 0 2px rgba(0,0,0,0.4), 0 0 12px rgba(0,0,0,0.5);
    transition:transform .12s;
  }
  .marker:hover{filter:brightness(1.25);}
  .marker.selected{outline:2px solid #fff;outline-offset:2px;}
  .m-person{background:radial-gradient(circle at 35% 30%, #7fd3c2, #2d6f60);}
  .m-vehicle{background:radial-gradient(circle at 35% 30%, #7fa8e0, #2c5384);}
  .m-truck{background:radial-gradient(circle at 35% 30%, #e0b06f, #8a5f26);}
  .m-equipment{background:radial-gradient(circle at 35% 30%, #d68f8f, #8a3a3a);}
  .m-building{background:radial-gradient(circle at 35% 30%, #b6a8e6, #5d4d97);}
  .m-waypoint{background:radial-gradient(circle at 35% 30%, #f0d68f, #a67e1f);}

  .scene-controls{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:6px;z-index:5;}
  .scene-btn{
    width:30px;height:30px;border-radius:7px;background:rgba(18,24,32,0.85);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);backdrop-filter:blur(4px);
  }
  .scene-btn:hover{color:var(--text);border-color:var(--accent-dim);}
  .scene-btn svg{width:14px;height:14px;}

  .layer-panel{
    position:absolute;top:14px;left:14px;z-index:5;width:172px;
    background:rgba(14,19,26,0.88);border:1px solid var(--line);border-radius:var(--radius-sm);
    backdrop-filter:blur(6px);padding:10px 12px;
  }
  .layer-panel-title{font-size:10px;letter-spacing:1px;color:var(--text-faint);font-weight:600;margin-bottom:8px;}
  .layer-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;color:var(--text-dim);}
  .layer-row input{accent-color:var(--accent);width:13px;height:13px;}

  .obj-info-panel{
    position:absolute;bottom:14px;right:14px;z-index:6;width:240px;
    background:rgba(14,19,26,0.94);border:1px solid var(--accent-dim);border-radius:var(--radius-sm);
    box-shadow:0 0 24px rgba(95,196,174,0.15);
    padding:14px 15px;display:none;
  }
  .obj-info-panel.show{display:block;animation:fadein .18s ease;}
  .obj-info-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .obj-info-id{font-size:12.5px;font-weight:600;font-family:'IBM Plex Mono';color:var(--accent);}
  .obj-info-close{color:var(--text-faint);font-size:16px;line-height:1;cursor:pointer;}
  .obj-info-row{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0;color:var(--text-dim);}
  .obj-info-row span:last-child{color:var(--text);font-family:'IBM Plex Mono';}

  .digital-twin-status{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:5;text-align:center;
  }

  /* Overview hero */
  .hero-card{position:relative;height:340px;overflow:hidden;}
  .hero-stats{
    position:absolute;bottom:0;left:0;right:0;display:flex;gap:0;
    background:linear-gradient(0deg, rgba(9,13,17,0.92), rgba(9,13,17,0.5));
    padding:16px 20px;border-top:1px solid var(--line-soft);
  }
  .hero-stat{flex:1;border-right:1px solid var(--line-soft);padding:0 16px;}
  .hero-stat:first-child{padding-left:0;}
  .hero-stat:last-child{border-right:none;}
  .hero-stat-val{font-family:'IBM Plex Mono';font-size:19px;font-weight:600;}
  .hero-stat-label{font-size:10.5px;color:var(--text-faint);margin-top:2px;letter-spacing:0.4px;}

  .insight-panel{
    background:linear-gradient(135deg, rgba(95,196,174,0.07), rgba(95,196,174,0.01));
    border:1px solid rgba(95,196,174,0.22);border-radius:var(--radius);padding:17px 19px;
  }
  .insight-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
  .insight-icon{width:26px;height:26px;border-radius:7px;background:rgba(95,196,174,0.15);display:flex;align-items:center;justify-content:center;color:var(--accent);}
  .insight-icon svg{width:14px;height:14px;}
  .insight-title{font-size:12.5px;font-weight:600;}
  .insight-text{font-size:13px;color:var(--text-dim);line-height:1.55;margin-bottom:10px;}
  .insight-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;}
  .insight-list li{font-size:12.5px;color:var(--text-dim);display:flex;gap:8px;align-items:flex-start;}
  .insight-list li::before{content:"›";color:var(--accent);font-weight:700;}

  /* two column layouts */
  .cols-2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;}
  .cols-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .cols-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}

  /* Telemetry */
  .telem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .telem-item{padding:12px 14px;border-radius:var(--radius-sm);background:var(--surface-3);border:1px solid var(--line-soft);}
  .telem-label{font-size:10px;color:var(--text-faint);letter-spacing:0.6px;margin-bottom:5px;}
  .telem-value{font-family:'IBM Plex Mono';font-size:18px;font-weight:600;}

  .mission-stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;gap:10px;}
  .mission-stat:last-child{border-bottom:none;}
  .mission-stat span:first-child{color:var(--text-faint);}
  .mission-stat span:last-child{font-family:'IBM Plex Mono';font-weight:500;text-align:right;}

  /* AI detection frame */
  .frame-wrap{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line-soft);height:420px;
    background:linear-gradient(160deg,#141d1a,#0b1210 55%, #0a1512);}
  .frame-noise{position:absolute;inset:0;opacity:.5;
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, transparent 2px, transparent 4px);}
  .bbox{position:absolute;border:1.5px solid var(--accent);border-radius:3px;}
  .bbox-label{
    position:absolute;top:-19px;left:-1.5px;background:var(--accent);color:#06120f;
    font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px 3px 0 0;font-family:'IBM Plex Mono';white-space:nowrap;
  }
  .bbox.b-vehicle{border-color:var(--blue);}

  .timeline{display:flex;align-items:center;gap:0;margin:6px 0 4px 0;}

  .tl-node.selected-b .tl-dot{background:var(--amber);border-color:var(--amber);}
  .tl-line{position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line);z-index:1;}
  .tl-node:first-child .tl-line{display:none;}
  .tl-label{font-size:11.5px;font-weight:600;color:var(--text-dim);}
  .tl-node.active .tl-label{color:var(--text);}
  .tl-date{font-size:10px;color:var(--text-faint);font-family:'IBM Plex Mono';}

  .change-card{display:flex;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);background:var(--surface-3);border:1px solid var(--line-soft);align-items:flex-start;}
  .change-dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:4px;}
  .change-title{font-size:12.5px;font-weight:600;}
  .change-desc{font-size:11.5px;color:var(--text-faint);margin-top:2px;}

  .presence-dot{position:absolute;bottom:-1px;right:-1px;width:9px;height:9px;border-radius:50%;border:2px solid var(--surface-3);background:var(--accent);}

  .activity-time{font-size:10.5px;color:var(--text-faint);margin-top:2px;}

function goTo(pageId){
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.page===pageId));
  document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active', el.id==='page-'+pageId));

  document.getElementById('pageSub').textContent = PAGE_SUB[pageId];
  document.getElementById('bellDropdown').classList.remove('show');

  `;

function simulateLiveAlert(){
  const pool = [
    {sev:'info', title:'New telemetry packet received', desc:'MAVLink heartbeat nominal.'},
    {sev:'warning', title:'Object confidence below threshold', desc:'Re-scan recommended for Object #018.'},
    {sev:'info', title:'Mission checkpoint reached', desc:'Waypoint 4 of 6 completed.'}
  ];
  setInterval(()=>{
    const a = pool[Math.floor(Math.random()*pool.length)];
    AppData.alerts.unshift({...a, time:'just now'});
    if(AppData.alerts.length>12) AppData.alerts.pop();
    renderBell();
    const badge = document.getElementById('navAlertBadge');
    if(badge) badge.textContent = AppData.alerts.length;
    if(document.getElementById('page-alerts') && document.getElementById('page-alerts').classList.contains('active')) renderAlertsList('all');
  }, 25000);
}

const LiveReconScene = (function () {
  const instances = {};

  function init(containerId) {
    if (!window.THREE) return;
    const container = document.getElementById(containerId);
    if (!container || instances[containerId]) return;

    const existing = container.querySelector('.scene-world');
    if (existing) existing.remove();
    const oldCanvas = container.querySelector('canvas');
    if (oldCanvas) oldCanvas.remove();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x071015);

    const camera = new THREE.PerspectiveCamera(48, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(8, 6.5, 10);
    camera.lookAt(0, 1.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.domElement.style.position = 'absolute';
    renderer.domElement.style.inset = '0';
    renderer.domElement.style.width = '100%';
    renderer.domElement.style.height = '100%';
    renderer.domElement.style.display = 'block';
    container.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, 1.6);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
    dirLight.position.set(7, 12, 8);
    scene.add(dirLight);

    const terrainCanvas = document.createElement('canvas');
    terrainCanvas.width = 1024;
    terrainCanvas.height = 1024;
    const terrainCtx = terrainCanvas.getContext('2d');

    const terrainTexture = terrainCtx.createLinearGradient(0, 0, 0, 1024);
    terrainTexture.addColorStop(0, '#3f5e52');
    terrainTexture.addColorStop(0.5, '#8ca36c');
    terrainTexture.addColorStop(1, '#5f7d45');
    terrainCtx.fillStyle = terrainTexture;
    terrainCtx.fillRect(0, 0, 1024, 1024);

    for (let i = 0; i < 18; i++) {
      const x = Math.random() * 1024;
      const y = Math.random() * 1024;
      const w = 80 + Math.random() * 180;
      const h = 80 + Math.random() * 150;
      const isField = Math.random() > 0.35;
      terrainCtx.fillStyle = isField ? (Math.random() > 0.4 ? '#a7c35d' : '#8dbb4f') : '#49705a';
      terrainCtx.fillRect(x, y, w, h);
      terrainCtx.strokeStyle = 'rgba(255,255,255,0.15)';
      terrainCtx.lineWidth = 2;
      terrainCtx.strokeRect(x, y, w, h);
    }

    terrainCtx.fillStyle = 'rgba(99, 156, 151, 0.7)';
    terrainCtx.fillRect(550, 500, 300, 220);
    terrainCtx.fillStyle = 'rgba(138, 182, 210, 0.75)';
    terrainCtx.fillRect(610, 560, 170, 120);

    terrainCtx.strokeStyle = 'rgba(245, 241, 228, 0.8)';
    terrainCtx.lineWidth = 4;
    terrainCtx.beginPath();
    terrainCtx.moveTo(0, 760);
    terrainCtx.lineTo(1024, 760);
    terrainCtx.moveTo(0, 250);
    terrainCtx.lineTo(1024, 250);
    terrainCtx.moveTo(470, 0);
    terrainCtx.lineTo(470, 1024);
    terrainCtx.moveTo(780, 0);
    terrainCtx.lineTo(780, 1024);
    terrainCtx.stroke();

    terrainCtx.fillStyle = 'rgba(144, 82, 44, 0.8)';
    terrainCtx.beginPath();
    terrainCtx.moveTo(180, 220);
    terrainCtx.lineTo(420, 180);
    terrainCtx.lineTo(480, 360);
    terrainCtx.lineTo(240, 420);
    terrainCtx.closePath();
    terrainCtx.fill();

    terrainCtx.fillStyle = 'rgba(255,255,255,0.22)';
    for (let i = 0; i < 50; i++) {
      terrainCtx.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
    }

    const terrainTextureMap = new THREE.CanvasTexture(terrainCanvas);
    terrainTextureMap.wrapS = THREE.RepeatWrapping;
    terrainTextureMap.wrapT = THREE.RepeatWrapping;
    terrainTextureMap.repeat.set(1, 1);

    const terrain = new THREE.Mesh(
      new THREE.PlaneGeometry(29, 29, 80, 80),
      new THREE.MeshStandardMaterial({ map: terrainTextureMap, roughness: 1, metalness: 0.05 })
    );
    terrain.rotation.x = -Math.PI / 2;
    terrain.position.y = -0.18;
    const terrainPos = terrain.geometry.attributes.position;
    for (let i = 0; i < terrainPos.count; i++) {
      const x = terrainPos.getX(i);
      const y = terrainPos.getY(i);
      const height = Math.sin(x * 0.9) * 0.18 + Math.cos(y * 0.8) * 0.16 + Math.sin((x + y) * 0.6) * 0.1;
      terrainPos.setZ(i, height);
    }
    terrain.geometry.computeVertexNormals();
    scene.add(terrain);

    const mapOutline = new THREE.Mesh(
      new THREE.BoxGeometry(18, 0.05, 18),
      new THREE.MeshStandardMaterial({ color: 0x0d1b23, transparent: true, opacity: 0.25 })
    );
    mapOutline.position.set(0, 0.12, 0);
    scene.add(mapOutline);

    const roadGroup = new THREE.Group();
    const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x202d38, roughness: 0.9, metalness: 0.08 });
    const laneMaterial = new THREE.MeshStandardMaterial({ color: 0x6fd9d0, emissive: 0x6fd9d0, emissiveIntensity: 0.18 });

    const road1 = new THREE.Mesh(new THREE.BoxGeometry(8.8, 0.08, 1.5), roadMaterial);
    road1.position.set(0, 0.08, 0);
    roadGroup.add(road1);

    const road2 = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.08, 9.6), roadMaterial);
    road2.position.set(0, 0.08, 0);
    roadGroup.add(road2);

    const roadLane = new THREE.Mesh(new THREE.BoxGeometry(6.6, 0.04, 0.12), laneMaterial);
    roadLane.position.set(0, 0.12, 0.35);
    roadGroup.add(roadLane);

    const roadLane2 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.04, 7.2), laneMaterial);
    roadLane2.position.set(0.35, 0.12, 0);
    roadGroup.add(roadLane2);
    scene.add(roadGroup);

    const buildingGroup = new THREE.Group();
    const buildingMeshes = [];
    const buildingData = [
      { x: -5.8, z: -2.8, h: 2.4, w: 2.1, d: 2.2 },
      { x: -2.0, z: -4.5, h: 3.2, w: 2.3, d: 2.3 },
      { x: 2.0, z: -3.8, h: 2.7, w: 2.0, d: 1.8 },
      { x: 5.8, z: -2.5, h: 4.0, w: 2.4, d: 2.2 },
      { x: 6.1, z: 2.2, h: 3.2, w: 2.1, d: 1.8 },
      { x: -4.8, z: 3.8, h: 2.8, w: 2.6, d: 2.3 },
      { x: -0.4, z: 3.8, h: 3.5, w: 1.8, d: 1.9 },
      { x: 3.2, z: 4.4, h: 2.7, w: 2.0, d: 1.7 },
      { x: 0.0, z: -0.8, h: 1.8, w: 7.4, d: 1.4 }
    ];

    buildingData.forEach(({ x, z, h, w, d }) => {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color: 0x9bb5c9, roughness: 0.76, metalness: 0.2, transparent: true, opacity: 0.9 })
      );
      mesh.position.set(x, h / 2, z);
      buildingGroup.add(mesh);
      buildingMeshes.push(mesh);
    });
    scene.add(buildingGroup);

    const entityGroup = new THREE.Group();
    const entityMeshes = [];
    const entityConfig = {
      Person: { color: 0x5fc4ae, height: 0.5, type: 'person' },
      Vehicle: { color: 0x5b8fc9, height: 0.7, type: 'vehicle' },
      Truck: { color: 0xd99a4e, height: 0.8, type: 'truck' },
      Equipment: { color: 0xd9695a, height: 0.9, type: 'equipment' },
      Building: { color: 0x9b8fd6, height: 0.8, type: 'building' }
    };

    AppData.objects.slice(0, 24).forEach((obj, index) => {
      const cfg = entityConfig[obj.type] || entityConfig.Person;
      const x = ((obj.x / 1000) * 22) - 11;
      const z = ((obj.y / 700) * 22) - 11;
      let mesh;

      if (obj.type === 'Person') {
        mesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.18, 12, 12),
          new THREE.MeshStandardMaterial({ color: cfg.color, emissive: cfg.color, emissiveIntensity: 0.25 })
        );
      } else if (obj.type === 'Truck') {
        mesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.6, 0.6, 1.2),
          new THREE.MeshStandardMaterial({ color: cfg.color, emissive: cfg.color, emissiveIntensity: 0.18 })
        );
      } else if (obj.type === 'Equipment') {
        mesh = new THREE.Mesh(
          new THREE.CylinderGeometry(0.18, 0.28, 0.9, 12),
          new THREE.MeshStandardMaterial({ color: cfg.color, emissive: cfg.color, emissiveIntensity: 0.2 })
        );
      } else {
        mesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.42, 0.42, 0.42),
          new THREE.MeshStandardMaterial({ color: cfg.color, emissive: cfg.color, emissiveIntensity: 0.16 })
        );
      }

      const baseY = obj.type === 'Person' ? 0.45 : 0.35;
      mesh.position.set(x, baseY + Math.sin(index * 0.9) * 0.05, z);
      mesh.userData = { obj, baseY };
      entityGroup.add(mesh);
      entityMeshes.push(mesh);
    });
    scene.add(entityGroup);

    const particleCount = 26000;
    const pointsGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      const radius = 9 + Math.random() * 8;
      const angle = Math.random() * Math.PI * 2;
      const y = Math.random() * 2.3;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      const idx = i * 3;
      positions[idx] = x;
      positions[idx + 1] = y;
      positions[idx + 2] = z;
      const c = new THREE.Color(0x5fc4ae);
      c.offsetHSL(Math.random() * 0.08, 0.12, 0.04);
      colors[idx] = c.r;
      colors[idx + 1] = c.g;
      colors[idx + 2] = c.b;
    }

    pointsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    pointsGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const particleMaterial = new THREE.PointsMaterial({
      size: 0.07,
      vertexColors: true,
      transparent: true,
      opacity: 0.9,
      sizeAttenuation: true
    });
    const pointCloud = new THREE.Points(pointsGeometry, particleMaterial);
    scene.add(pointCloud);

    const scanLine = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 0.22),
      new THREE.MeshBasicMaterial({ color: 0x5fc4ae, transparent: true, opacity: 0.45, side: THREE.DoubleSide })
    );
    scanLine.rotation.x = -Math.PI / 2;
    scanLine.position.set(0, 0.03, 0);
    scene.add(scanLine);

    const droneGroup = new THREE.Group();
    const droneBody = new THREE.Mesh(
      new THREE.ConeGeometry(0.32, 0.8, 5),
      new THREE.MeshStandardMaterial({ color: 0xe7c06f, emissive: 0x5d4215, emissiveIntensity: 0.25 })
    );
    droneBody.rotation.x = Math.PI / 2;
    droneGroup.add(droneBody);

    const beam = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.08, 8, 16, 1, true),
      new THREE.MeshBasicMaterial({ color: 0x5fc4ae, transparent: true, opacity: 0.45, side: THREE.DoubleSide })
    );
    beam.rotation.z = Math.PI / 2;
    beam.position.set(0, 0.1, 0);
    droneGroup.add(beam);
    scene.add(droneGroup);

    let yaw = 0;
    let drag = false;
    let lastX = 0;
    let lastY = 0;
    let camYaw = -0.7;
    let camPitch = 0.65;

    const handlePointerDown = (event) => {
      drag = true;
      lastX = event.clientX;
      lastY = event.clientY;
    };
    const handlePointerMove = (event) => {
      if (!drag) return;
      const dx = event.clientX - lastX;
      const dy = event.clientY - lastY;
      camYaw -= dx * 0.005;
      camPitch = Math.min(Math.max(camPitch - dy * 0.004, 0.2), 1.2);
      lastX = event.clientX;
      lastY = event.clientY;
    };
    const handlePointerUp = () => { drag = false; };

    container.addEventListener('pointerdown', handlePointerDown);
    window.addEventListener('pointermove', handlePointerMove);
    window.addEventListener('pointerup', handlePointerUp);

    const tick = () => {
      requestAnimationFrame(tick);

      yaw += 0.006;
      const orbitRadius = 12;
      const x = Math.cos(yaw + camYaw) * orbitRadius;
      const z = Math.sin(yaw + camYaw) * orbitRadius;
      camera.position.x = x;
      camera.position.z = z;
      camera.position.y = 5.2 + Math.sin(camPitch + 0.8) * 2.2;
      camera.lookAt(0, 1.4, 0);

      droneGroup.position.set(Math.sin(yaw * 1.3) * 6, 1.8 + Math.sin(yaw * 2.2) * 0.7, Math.cos(yaw * 1.5) * 5);
      droneGroup.rotation.y = -yaw * 1.2;
      pointCloud.rotation.y += 0.0014;
      pointCloud.rotation.x = 0.18;
      scanLine.position.z = Math.sin(yaw * 3.5) * 10;
      scanLine.rotation.z = yaw * 0.8;

      const pulse = 0.5 + Math.sin(yaw * 14) * 0.12;
      beam.material.opacity = 0.25 + pulse * 0.2;
      beam.scale.y = 0.8 + Math.sin(yaw * 12) * 0.2;

      buildingMeshes.forEach((mesh, idx) => {
        mesh.position.y = 0.1 + Math.sin(yaw * 2.6 + idx) * 0.06;
      });

      entityMeshes.forEach((mesh, idx) => {
        const { obj, baseY } = mesh.userData;
        const bob = Math.sin(yaw * 5 + idx) * 0.08;
        mesh.position.y = baseY + bob + (obj.type === 'Person' ? 0.12 : 0.0);
      });

      roadGroup.rotation.y = yaw * 0.2;
      renderer.render(scene, camera);
    };

    tick();
    instances[containerId] = { renderer, scene, camera, container };
  }

  return { init };
})();

const SceneKit = (function(){
  const instances = {};

  const BUILDINGS = [
    {x:140,y:120,w:90,d:70,h:60,c:1},{x:270,y:150,w:60,d:60,h:100},{x:420,y:110,w:120,d:80,h:44},
    {x:610,y:160,w:70,d:70,h:130},{x:760,y:130,w:100,d:60,h:52},{x:200,y:400,w:80,d:60,h:38},
    {x:520,y:440,w:140,d:90,h:70},{x:820,y:420,w:60,d:60,h:90}
  ];
  const ROADS = [
    {x:0,y:260,w:1000,h:14},{x:480,y:0,w:14,h:700},{x:0,y:500,w:1000,h:12}
  ];
  const VEG = [ [90,260],[330,300],[500,90],[680,260],[900,300],[150,560],[380,600],[650,560],[930,150],[60,460] ];

  function buildStaticLayer(root){
    root.querySelectorAll('.bldg,.scene-road,.scene-veg').forEach(n=>n.remove());
    BUILDINGS.forEach(b=>{
      const el = document.createElement('div');
      el.className='bldg'; el.dataset.layer='buildings';
      el.style.left=b.x+'px'; el.style.top=b.y+'px'; el.style.width=b.w+'px'; el.style.height=b.d+'px';
      el.style.transform=`translateZ(0px)`;
      el.innerHTML = `
        <div class="face face-top" style="width:${b.w}px;height:${b.d}px;transform:rotateX(90deg) translateZ(${b.h}px);"></div>
        <div class="face face-front" style="width:${b.w}px;height:${b.h}px;transform:translateZ(${b.d}px) translateY(-${b.h}px) rotateX(0deg);top:${b.d}px;"></div>
        <div class="face face-side" style="width:${b.d}px;height:${b.h}px;transform-origin:left; transform:rotateY(90deg) translateZ(0px) translateY(-${b.h}px);top:${b.d}px;"></div>
      `;
      root.appendChild(el);
    });
    ROADS.forEach(r=>{
      const el = document.createElement('div');
      el.className='scene-road'; el.dataset.layer='roads';
      el.style.left=r.x+'px'; el.style.top=r.y+'px'; el.style.width=r.w+'px'; el.style.height=r.h+'px';
      root.appendChild(el);
    });
    VEG.forEach(([x,y])=>{
      const el = document.createElement('div');
      const s = 22+Math.random()*18;
      el.className='scene-veg'; el.dataset.layer='vegetation';
      el.style.left=(x-s/2)+'px'; el.style.top=(y-s/2)+'px'; el.style.width=s+'px'; el.style.height=s+'px';
      root.appendChild(el);
    });
  }

  function project(o){ return {left:o.x, top:o.y}; }

  function buildMarkers(root, onClick){
    root.querySelectorAll('.marker').forEach(n=>n.remove());
    AppData.objects.forEach(o=>{
      const el = document.createElement('div');
      const p = project(o);
      el.className = 'marker '+o.cls;
      el.dataset.layer = o.type==='Person'?'people':o.type==='Vehicle'?'vehicles':o.type==='Truck'?'vehicles':o.type==='Equipment'?'equipment':'buildings';
      el.style.left = p.left+'px'; el.style.top = p.top+'px';
      el.style.transform = 'translateZ(6px)';
      el.textContent = o.icon;
      el.title = o.id+' — '+o.type;
      el.addEventListener('click', (e)=>{ e.stopPropagation(); onClick(o, el, root); });
      root.appendChild(el);
    });
  }

  function buildWaypoints(root){
    root.querySelectorAll('.marker.m-waypoint,.wp-line').forEach(n=>n.remove());
    const pts = AppData.waypoints.map((w,i)=>({x: 100+i*150, y: 300+((i%2)?-140:140)}));
    pts.forEach((p,i)=>{
      const el = document.createElement('div');
      el.className='marker m-waypoint';
      el.style.left=p.x+'px'; el.style.top=p.y+'px'; el.style.transform='translateZ(8px)';
      el.textContent = i+1;
      el.style.fontSize='11px'; el.style.fontWeight='700'; el.style.color='#241a03';
      root.appendChild(el);
    });
  }

  function init(containerId, initialScale, waypointMode){
    if(instances[containerId] && instances[containerId].built) { return; }
    const viewport = document.getElementById(containerId);
    if(!viewport) return;
    const world = viewport.querySelector('.scene-world');
    buildStaticLayer(world);
    const infoPanel = viewport.parentElement.querySelector('.obj-info-panel');

    function showInfo(o){
      if(!infoPanel) return;
      infoPanel.classList.add('show');
      infoPanel.innerHTML = `
        <div class="obj-info-head">
          <span class="obj-info-id">OBJECT #${String(o.num).padStart(3,'0')}</span>
          <span class="obj-info-close">&times;</span>
        </div>
        <div class="obj-info-row"><span>Type</span><span>${o.type}</span></div>
        <div class="obj-info-row"><span>Confidence</span><span>${o.confidence}%</span></div>
        <div class="obj-info-row"><span>Latitude</span><span>${o.lat}</span></div>
        <div class="obj-info-row"><span>Longitude</span><span>${o.lon}</span></div>
        <div class="obj-info-row"><span>Altitude</span><span>${o.alt} m</span></div>
        <div class="obj-info-row"><span>Status</span><span>${o.status}</span></div>
        <div class="obj-info-row"><span>First Detected</span><span>${o.firstDetected}</span></div>
        <div class="obj-info-row"><span>Last Detected</span><span>${o.lastDetected}</span></div>
      `;
      infoPanel.querySelector('.obj-info-close').addEventListener('click', ()=>infoPanel.classList.remove('show'));
    }

    if(waypointMode){
      buildWaypoints(world);
    } else {
      buildMarkers(world, (o, el)=>{
        world.querySelectorAll('.marker.selected').forEach(m=>m.classList.remove('selected'));
        el.classList.add('selected');
        showInfo(o);
      });
    }

    let rotX = 58, rotZ = -28, scale = initialScale || 0.62;
    let dragging = false, lastX=0, lastY=0;
    function applyTransform(){
      world.style.transform = `translate(-50%,-50%) rotateX(${rotX}deg) rotateZ(${rotZ}deg) scale(${scale})`;
    }
    viewport.addEventListener('mousedown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
    window.addEventListener('mouseup', ()=>dragging=false);
    window.addEventListener('mousemove', e=>{
      if(!dragging) return;
      const dx = e.clientX-lastX, dy = e.clientY-lastY;
      rotZ += dx*0.25;
      rotX = Math.min(80, Math.max(30, rotX - dy*0.2));
      lastX=e.clientX; lastY=e.clientY;
      applyTransform();
    });
    viewport.addEventListener('wheel', e=>{
      e.preventDefault();
      scale = Math.min(1.3, Math.max(0.3, scale - e.deltaY*0.0006));
      applyTransform();
    }, {passive:false});

    const controls = viewport.parentElement.querySelectorAll('.scene-btn');
    controls.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(btn.dataset.act==='zoomin') scale = Math.min(1.3, scale+0.08);
        if(btn.dataset.act==='zoomout') scale = Math.max(0.3, scale-0.08);
        if(btn.dataset.act==='reset'){ rotX=58; rotZ=-28; scale = initialScale||0.62; }
        applyTransform();
      });
    });

    const layerPanel = viewport.parentElement.querySelector('.layer-panel');
    if(layerPanel){
      layerPanel.querySelectorAll('input[type=checkbox]').forEach(cb=>{
        cb.addEventListener('change', ()=>{
          const layer = cb.dataset.layer;
          world.querySelectorAll(`[data-layer="${layer}"]`).forEach(n=>{
            n.style.display = cb.checked ? '' : 'none';
          });
        });
      });
    }

    applyTransform();
    instances[containerId] = {built:true};
  }

  return {init};
})();

function startTelemetry(){
  const path = document.getElementById('flightPath');
  const dot = document.getElementById('droneDot');
  if(!path || !dot) return;
  const len = path.getTotalLength();
  let t = 0;
  clearInterval(window.__telemInterval);
  window.__telemInterval = setInterval(()=>{
    t = (t+0.004)%1;
    const pt = path.getPointAtLength(t*len);
    dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y);
    const alt = (110 + Math.sin(t*20)*8).toFixed(1);
    const spd = (10 + Math.sin(t*14)*3).toFixed(1);
    const head = Math.round((t*720)%360);
    const bat = Math.max(40, 76 - Math.floor(t*30));
    const lat = (26.9124 + Math.sin(t*10)*0.004).toFixed(4);
    const lon = (75.7873 + Math.cos(t*10)*0.004).toFixed(4);
    const rate = 38 + Math.round(Math.sin(t*30)*4);
    const set = (id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
    set('telAlt', alt+' m'); set('telSpeed', spd+' m/s'); set('telHeading', head+'°');
    set('telLat', lat+'°'); set('telLon', lon+'°'); set('telBattery', bat+'%');
    set('mavRate', rate+' Hz');
  }, 120);
}

function bindAnalyticsPage(){

/* ============================================================
   PAGE: ALERTS
   ============================================================ */
const ALERT_ICON = {critical:'alert', warning:'alert', info:'bell'};
function pageAlerts(){
  return `
  <div class="panel panel-glow">
    <div class="panel-head">
      <span class="panel-title">REAL-TIME ALERTS</span>
      <div class="filter-tabs" id="alertFilters">
        <span class="filter-tab active" data-f="all">All</span>
        <span class="filter-tab" data-f="critical">Critical</span>
        <span class="filter-tab" data-f="warning">Warning</span>
        <span class="filter-tab" data-f="info">Info</span>
      </div>
    </div>
    <div class="panel-body" style="display:flex;flex-direction:column;gap:10px;" id="alertsList"></div>
  </div>
  `;
}
function renderAlertsList(filter){
  const list = document.getElementById('alertsList');
  if(!list) return;
  const rows = AppData.alerts.filter(a=> filter==='all' || a.sev===filter);
  list.innerHTML = rows.length ? rows.map(a=>`
    <div class="alert-row">
      <div class="alert-icon" style="background:rgba(${a.sev==='critical'?'217,105,90':a.sev==='warning'?'217,154,78':'91,143,201'},0.12);color:${SEV_COLOR[a.sev]};">${ICONS[ALERT_ICON[a.sev]]}</div>
      <div style="flex:1;">
        <div class="alert-title">${a.title}</div>
        <div class="alert-desc">${a.desc}</div>
      </div>
      <div class="alert-time">${a.time}</div>
    </div>
  `).join('') : `<div class="empty-state">${ICONS.bell}<div>No alerts in this category</div></div>`;
}
function bindAlertsPage(){
  renderAlertsList('all');
  document.querySelectorAll('#alertFilters .filter-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('#alertFilters .filter-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      renderAlertsList(tab.dataset.f);
    });
  });
}

/* ============================================================
   PAGE: TEAM COLLABORATION
   ============================================================ */
function pageTeam(){
  return `
  <div class="cols-2">
    <div class="panel panel-glow">
      <div class="panel-head"><span class="panel-title">TEAM MEMBERS</span><span class="tag">${AppData.team.length} online team</span></div>
      <div class="panel-body" style="display:flex;flex-direction:column;gap:9px;">
        ${AppData.team.map(t=>`
          <div class="team-card">
            <div class="avatar ${t.status==='away'?'away':''}">${t.initials}<span class="presence-dot ${t.status}"></span></div>
            <div style="flex:1;">
              <div style="font-size:13px;font-weight:600;">${t.name}</div>
              <div style="font-size:11px;color:var(--text-faint);">${t.role}</div>
            </div>
            <span class="badge ${t.status==='online'?'badge-ok':t.status==='away'?'badge-amber':'badge-blue'}">${t.status}</span>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="panel panel-glow">
      <div class="panel-head"><span class="panel-title">ACTIVITY FEED</span></div>
      <div class="panel-body" style="padding-bottom:8px;" id="activityFeed">
        ${AppData.activity.map(a=>`
          <div class="activity-item">
            <div class="avatar" style="width:28px;height:28px;font-size:10px;">${a.who.split(' ').map(w=>w[0]).join('')}</div>
            <div><div class="activity-text"><b>${a.who}</b> ${a.text}</div><div class="activity-time">${a.time}</div></div>
          </div>
        `).join('')}
      </div>
      <div class="panel-body" style="padding-top:0;display:flex;gap:8px;">
        <input type="text" id="commentInput" placeholder="Add a comment or note..." style="flex:1;">
        <button class="btn btn-primary btn-sm" id="commentSendBtn">${ICONS.send}</button>
      </div>
    </div>
  </div>
  `;
}
function bindTeamPage(){
  const btn = document.getElementById('commentSendBtn');
  const input = document.getElementById('commentInput');
  if(!btn) return;
  function send(){
    const val = input.value.trim();
    if(!val) return;
    AppData.activity.unshift({who:'You', text:`commented: "${val}"`, time:'just now'});
    input.value='';
    const feed = document.getElementById('activityFeed');
    feed.innerHTML = AppData.activity.map(a=>`
      <div class="activity-item">
        <div class="avatar" style="width:28px;height:28px;font-size:10px;">${a.who.split(' ').map(w=>w[0]).join('')}</div>
        <div><div class="activity-text"><b>${a.who}</b> ${a.text}</div><div class="activity-time">${a.time}</div></div>
      </div>
    `).join('');
  }
  btn.addEventListener('click', send);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
}

/* ============================================================
   MOUNT
   ============================================================ */
function mount(){
  renderNav();
  renderBell();
  const content = document.getElementById('content');
  const pages = [
    {id:'overview', html:pageOverview},
    {id:'planning', html:pagePlanning},
    {id:'twin', html:pageTwin},
    {id:'mission', html:pageMission},
    {id:'detection', html:pageDetection},
    {id:'change', html:pageChange},
    {id:'maintenance', html:pageMaintenance},
    {id:'geo', html:pageGeo},
    {id:'executive', html:pageExecutive},
    {id:'analytics', html:pageAnalytics},
    {id:'alerts', html:pageAlerts},
    {id:'team', html:pageTeam},
    {id:'settings', html:pageSettings}
  ];
  content.innerHTML = pages.map(p=>`<div class="page" id="page-${p.id}">${p.html()}</div>`).join('')
    + `<footer class="tagline">From Drone Data to an <b>Intelligent 3D Digital Twin</b>.</footer>`;

  goTo('overview');
  tickClock();
  startTelemetry();
  bindDetectionButton();
  bindChangePage();
  bindGeoPage();
  bindPlanningPage();
  bindAnalyticsPage();
  bindAlertsPage();
  bindTeamPage();
  simulateLiveAlert();
}
document.addEventListener('DOMContentLoaded', mount);
</script>
